<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;margin:0;padding:0;background-color:#f5faff;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;font-family:'Inter',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: 'class', theme: { extend: { colors: { 'inverse-on-surface': '#e8f2fb', 'primary-container': '#25d366', 'tertiary-fixed-dim': '#72d8c8', 'secondary-fixed': '#a8f0e3', 'outline': '#6c7b6b', 'inverse-surface': '#283238', 'secondary-container': '#a5ede0', 'on-primary-fixed': '#002109', 'outline-variant': '#bbcbb9', 'primary-fixed': '#66ff8e', 'on-error-container': '#93000a', 'surface-container-lowest': '#ffffff', 'inverse-primary': '#3de273', 'on-tertiary-container': '#005249', 'on-surface-variant': '#3c4a3d', 'on-secondary': '#ffffff', 'error-container': '#ffdad6', 'surface-tint': '#006d2f', 'surface-container': '#e5eff8', 'on-tertiary': '#ffffff', 'on-primary': '#ffffff', 'background': '#f5faff', 'on-tertiary-fixed-variant': '#005047', 'tertiary-fixed': '#8ff4e3', 'on-secondary-container': '#226e63', 'on-background': '#131d23', 'on-primary-container': '#005523', 'surface-container-high': '#dfeaf2', 'on-primary-fixed-variant': '#005322', 'primary': '#006d2f', 'on-secondary-fixed-variant': '#005047', 'on-secondary-fixed': '#00201c', 'surface-dim': '#d1dbe4', 'on-error': '#ffffff', 'surface': '#f5faff', 'primary-fixed-dim': '#3de273', 'surface-container-highest': '#d9e4ec', 'secondary': '#1c695f', 'surface-bright': '#f5faff', 'surface-variant': '#d9e4ec', 'on-surface': '#131d23', 'secondary-fixed-dim': '#8cd4c7', 'tertiary-container': '#63c9b9', 'on-tertiary-fixed': '#00201c', 'surface-container-low': '#eaf5fe', 'tertiary': '#006b5f', 'error': '#ba1a1a' }, borderRadius: { 'DEFAULT': '0.25rem', 'lg': '0.5rem', 'xl': '0.75rem', 'full': '9999px' }, spacing: { 'margin': '1rem', 'space-lg': '1.5rem', 'space-xl': '2rem', 'space-xs': '0.25rem', 'margin-desktop': '2rem', 'gutter': '1rem', 'space-sm': '0.5rem', 'space-md': '1rem', 'margin-tablet': '1.5rem', 'space-2xl': '3rem' }, fontFamily: { 'label-lg': ['Inter'], 'label-md': ['Inter'], 'display-lg': ['Inter'], 'body-sm': ['Inter'], 'label-sm': ['Inter'], 'body-lg': ['Inter'], 'body-md': ['Inter'], 'headline-lg': ['Inter'], 'headline-md': ['Inter'], 'headline-sm': ['Inter'] }, fontSize: { 'label-lg': ['14px', { lineHeight: '20px', letterSpacing: '0.01em', fontWeight: '600' }], 'label-md': ['12px', { lineHeight: '16px', letterSpacing: '0.02em', fontWeight: '500' }], 'display-lg': ['32px', { lineHeight: '40px', letterSpacing: '-0.02em', fontWeight: '700' }], 'body-sm': ['13px', { lineHeight: '18px', letterSpacing: '0.01em', fontWeight: '400' }], 'label-sm': ['11px', { lineHeight: '14px', letterSpacing: '0.03em', fontWeight: '500' }], 'body-lg': ['16px', { lineHeight: '24px', letterSpacing: '0em', fontWeight: '400' }], 'body-md': ['14px', { lineHeight: '20px', letterSpacing: '0em', fontWeight: '400' }], 'headline-lg': ['24px', { lineHeight: '32px', letterSpacing: '-0.015em', fontWeight: '600' }], 'headline-md': ['20px', { lineHeight: '28px', letterSpacing: '-0.01em', fontWeight: '600' }], 'headline-sm': ['18px', { lineHeight: '24px', letterSpacing: '0em', fontWeight: '600' }] } } } };</script></head><body class="bg-surface text-on-surface flex flex-col min-h-screen relative selection:bg-primary-container selection:text-on-primary-fixed pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface px-margin"><div class="flex flex-col w-full pb-12 pt-4 items-center justify-between min-h-[calc(100vh-4rem)]">
<!-- Top Decorative Calm Glow -->
<div class="w-full flex justify-center mb-6">
<div class="w-20 h-1 rounded-full bg-surface-container-highest"></div>
</div>
<!-- Main Card Container -->
<div class="w-full max-w-sm flex flex-col items-center">
<!-- Brand Logo Mark & Header -->
<div class="flex flex-col items-center text-center mb-8">
<div class="relative mb-5 flex items-center justify-center p-3 rounded-2xl bg-surface-container-low shadow-sm">
<img alt="LearnHub Logo" class="h-12 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/ALJJyrCYgrW0nKNFD4--ORMdnbohteXbTWTLvlPUTnYJVqH_yvc6CHV8pF2l8Ei7tQG-g7UIgwpx35G7xcAb0ZTF8Mg6ygwa6nvx-KkI85bH1w5biqTnHuo66_b9AvEknMmMcZijfTPc_7CnECDd3MSmjRq69owcVd9Evh1bUGdWarIS0wTfxqVzDItdZOPTpDz3jYbyI9-m-ixWFPhQ0qxH8-e-PvXDRPzU7nZu1IRJQFfRyQ"/>
<div class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-primary-container rounded-full flex items-center justify-center">
<span class="w-1.5 h-1.5 bg-surface-container-lowest rounded-full"></span>
</div>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2 font-semibold tracking-tight">
        Welcome to LearnHub
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] leading-relaxed">
        Access your company training &amp; assigned video tutorials
      </p>
</div>
<!-- Elevated Focus Authentication Card -->
<div class="w-full bg-surface-container-lowest rounded-xl p-space-lg shadow-sm flex flex-col">
<form class="flex flex-col gap-4" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<!-- Identity Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="corporateId">
            Work Email or Corporate ID
          </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline pointer-events-none text-[20px]">
              mail
            </span>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-xl outline-none placeholder:text-outline-variant transition-all duration-150 focus:bg-surface-container-low" id="corporateId" onblur="this.style.boxShadow='0 0 0 1px #bbcbb9';" onfocus="this.style.boxShadow='0 0 0 2px #25d366';" placeholder="company.email@organization.com" required="" style="box-shadow: 0 0 0 1px #bbcbb9;" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="passwordField">
              Password
            </label>
<button class="font-label-sm text-label-sm text-secondary hover:text-tertiary transition-colors" onclick="triggerForgot()" type="button">
              Forgot password?
            </button>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline pointer-events-none text-[20px]">
              lock
            </span>
<input class="w-full pl-11 pr-11 py-3 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-xl outline-none placeholder:text-outline-variant transition-all duration-150 tracking-wider focus:bg-surface-container-low" id="passwordField" onblur="this.style.boxShadow='0 0 0 1px #bbcbb9';" onfocus="this.style.boxShadow='0 0 0 2px #25d366';" placeholder="••••••••••••" required="" style="box-shadow: 0 0 0 1px #bbcbb9;" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 p-1 rounded-lg text-outline hover:text-on-surface flex items-center justify-center transition-colors" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">
                visibility
              </span>
</button>
</div>
</div>
<!-- Subtle Remember / Keep Signed In (WhatsApp Quiet Style) -->
<div class="flex items-center justify-between mt-1">
<label class="flex items-center gap-2.5 cursor-pointer select-none">
<input checked="" class="hidden peer" id="rememberDevice" type="checkbox"/>
<div class="w-4 h-4 rounded bg-surface-container-high peer-checked:bg-primary-container flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-[14px] text-on-primary font-bold hidden peer-checked:block">
                check
              </span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">Stay signed in</span>
</label>
<span class="flex items-center gap-1 font-label-sm text-label-sm text-outline">
<span class="material-symbols-outlined text-[14px] text-tertiary">
              verified_user
            </span>
            SSO Ready
          </span>
</div>
<!-- Login Primary CTA Button -->
<button class="w-full mt-3 py-3.5 px-6 bg-primary-container text-on-primary font-label-lg text-label-lg font-semibold rounded-xl shadow-md hover:bg-on-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2" id="submitBtn" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-[18px]">
            arrow_forward
          </span>
</button>
</form>
</div>
</div>
<!-- Enterprise Footnote & Quiet Reassurance -->
<div class="w-full max-w-sm mt-8 flex flex-col items-center text-center">
<div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm mb-3">
<span class="material-symbols-outlined text-[16px] text-tertiary">
        domain
      </span>
<span>Enterprise Managed Workspace</span>
</div>
<p class="font-body-sm text-body-sm text-outline max-w-[280px] leading-relaxed">
      Assigned by your organization or institute. No self-registration needed.
    </p>
<!-- Support Help Trigger -->
<button class="mt-4 font-label-sm text-label-sm text-secondary flex items-center gap-1 hover:text-tertiary transition-colors" onclick="showHelpModal()" type="button">
<span class="material-symbols-outlined text-[15px]">
        help_outline
      </span>
<span>Need help logging in?</span>
</button>
</div>
<!-- Simple Modal / Toast for Quiet Delights -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-full bg-inverse-surface text-inverse-on-surface font-body-sm text-body-sm shadow-xl flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 z-50" id="infoToast">
<span class="material-symbols-outlined text-[18px] text-primary-fixed">info</span>
<span id="toastMsg">Check your corporate inbox for access credentials.</span>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const pwd = document.getElementById('passwordField');
    const icon = document.getElementById('eyeIcon');
    if (pwd.type === 'password') {
      pwd.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      pwd.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function showToast(msg) {
    const toast = document.getElementById('infoToast');
    const toastMsg = document.getElementById('toastMsg');
    toastMsg.textContent = msg;
    toast.classList.remove('opacity-0', 'pointer-events-none');
    toast.classList.add('opacity-100');
    setTimeout(() => {
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0', 'pointer-events-none');
    }, 3200);
  }

  function triggerForgot() {
    showToast('Password reset link routed to your corporate admin desk.');
  }

  function showHelpModal() {
    showToast('Reach out to your internal IT or HR administrator for access.');
  }

  function handleLogin() {
    const btn = document.getElementById('submitBtn');
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span><span>Signing in...</span>';
    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span><span>Authenticated</span>';
      btn.classList.remove('bg-primary-container');
      btn.classList.add('bg-primary');
    }, 900);
  }
</script></main></body></html>
