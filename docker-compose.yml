services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tutor_platform
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
    ports:
      - "5432:5432"
    volumes:
      - tutor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutor_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tutor
      MINIO_ROOT_PASSWORD: replace-me-now
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - tutor_minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  tutor_postgres_data:
  tutor_minio_data:
