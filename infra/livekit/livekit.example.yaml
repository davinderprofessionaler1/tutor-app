# Render this template to livekit.generated.yaml with your own secrets.
# Never expose port 7880 publicly. Public signaling goes through admission.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
keys:
  REPLACE_WITH_API_KEY: REPLACE_WITH_RANDOM_API_SECRET
webhook:
  api_key: REPLACE_WITH_API_KEY
  urls:
    - https://api.example.com/api/v1/live/webhooks/livekit
turn:
  enabled: true
  domain: turn.example.com
  tls_port: 5349
  udp_port: 3478
  # Mount and configure a valid TLS certificate and key before enabling TURN TLS.
  cert_file: /certs/turn.crt
  key_file: /certs/turn.key
logging:
  level: info
prometheus_port: 6789
