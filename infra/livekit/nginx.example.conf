# Public TLS terminates here; this proxy only reaches the admission gateway.
# Configure real DNS/certificates, and close external access to 7880/7882.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 443 ssl;
  server_name classroom.example.com;
  ssl_certificate /etc/letsencrypt/live/classroom.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/classroom.example.com/privkey.pem;
  location / {
    proxy_pass http://127.0.0.1:7882;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Signaling URLs contain JWTs. Do not log request URLs or access tokens.
    access_log off;
  }
}
